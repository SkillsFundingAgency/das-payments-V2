parameters:
  TargetProjects: 'src/SFA.DAS.Payments.PeriodEnd.Function/SFA.DAS.Payments.PeriodEnd.Function.csproj'

jobs:
- job: CodeBuild
  pool:
    name: DCT Build Pool
  variables:
  - group: BUILD Management Resources
  - name: SolutionBaseName
    value: SFA.DAS.Payments.PeriodEnd.Function
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk 2.1.x'
    inputs:
      packageType: sdk
      useGlobalJson: false
      version: 2.1.x
      includePreviewVersions: false
      requestTimeout: 300000
      performMultiLevelLookup: false
      installationPath: '$(Agent.ToolsDirectory)/dotnet'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: restore
      projects: ${{ parameters.TargetProjects }}
      noCache: true
      feedsToUse: 'select'
      vstsFeed: 'dct-pkg'
      includeNuGetOrg: true
      requestTimeout: 300000

  - task: PowerShell@2
    displayName: 'Set assembly version'
    inputs:
      targetType: 'inline'
      script: |
        $buildNumber = "$(Build.BuildNumber)"
        if ($buildNumber -match '^(\d{4})(\d{2})(\d{2})\.(\d+)$') {
          $assemblyVersion = "$([int]$Matches[1]).$([int]$Matches[2]).$([int]$Matches[3]).$([int]$Matches[4])"
        } else {
          $buildId = 0
          [int]::TryParse("$(Build.BuildId)", [ref]$buildId) | Out-Null
          $assemblyVersion = "1.0.0.$($buildId % 65535)"
        }
        Write-Host "##vso[task.setvariable variable=AssemblyVersion]$assemblyVersion"

  - task: MSBuild@1
    displayName: 'Build solution src/SFA.DAS.Payments.PeriodEnd.Function/SFA.DAS.Payments.PeriodEnd.Function.csproj'
    inputs:
      solution: ${{ parameters.TargetProjects }}
      msbuildVersion: latest
      msbuildArchitecture: x64
      platform: '$(BuildPlatform)'
      configuration: '$(BuildConfiguration)'
      msbuildArguments: '/p:Version=$(AssemblyVersion) /p:FileVersion=$(AssemblyVersion) /p:OutputPath=$(build.artifactstagingdirectory)\PeriodEnd-Function'
      clean: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Pipeline Artifact'
    inputs:
      targetPath: '$(build.artifactstagingdirectory)\PeriodEnd-Function'
      artifact: PeriodEndFunction
      publishLocation: 'pipeline'
